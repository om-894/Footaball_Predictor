[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "footy"
version = "2.0.0"
description = "Leakage-free player prop forecasting for football, built on FBref match data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "torch>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Live FBref scraping. Heavy (drives a real browser) and entirely optional -- the
# GitHub-release mirrors in footy.sources are the default path.
live = ["soccerdata>=1.9.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
footy = "footy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/footy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
